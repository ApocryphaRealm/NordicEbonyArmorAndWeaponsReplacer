; Truly Nordic Ebony Armor and Weapons - the no-ESP option (needs SkyPatcher, Nexus 106659).
;
; In this option the worn armour is plain loose meshes on vanilla's own ebony paths
; (meshes\armor\ebony\m|f\), so nothing here moves a model. The one thing the plugin does that a loose
; mesh cannot is the helmet's body slots: vanilla's ebony helmet addon (EbonyHelmetAA) sits in slot 30
; (Head), which hides the head, and NordwarUA's wolf helm is OPEN - in slot 30 the head vanishes and
; nothing shows in its place. The plugin version gives the addon slots 31, 41 and 43 (Hair, Long Hair,
; Ears), as Legacy of Ysgramor does. SkyPatcher cannot edit an addon record directly; it edits the
; armour, and a slot change on an armour carries to the addons attached to it. So this targets every
; armour that uses EbonyHelmetAA (the base helmet and all its enchanted variants) by that addon.
;
; Biped slots are written by INDEX here: index = slot number - 30 (slot 30 = 0, 31 = 1, 41 = 11, 43 = 13).
; Difference from the plugin version: the plugin leaves the helmet ARMOUR records in slot 30; this also
; takes slot 30 off the armour records, so a slot-30 item can be worn together with the helmet.

filterByArmorAddons=Skyrim.esm|05B69A:bipedSlotsToRemove=0:bipedSlotsToAdd=1,11,13
