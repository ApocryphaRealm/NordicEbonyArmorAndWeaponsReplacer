; Truly Nordic Ebony Armor and Weapons - optional patch for Ryn's Snazzy Last Vigil (Nexus 76385, by Ryn and Gutmaw).
; Installer: "Compatibility patches (requires SkyPatcher)" > "Ryn's Snazzy Last Vigil - Ebony Warrior set".
; This file is named after Ryn's plugin, so SkyPatcher reads it only when that plugin is active.
;
; Ryn's mod gives the Ebony Warrior NEW armour records (GM_EbonyWarrior*, 800-804) with their own addons and
; their own meshes, so nothing aimed at vanilla's ebony records reaches them. These lines swap each one's addon
; for vanilla's ebony addon - which is where our worn meshes are - and its ground model for vanilla's ebony one.
; Names, stats, enchantments and keywords stay Ryn's. Only the Ebony Warrior's own set is patched: Ryn's
; craftable Vitreous Ebony set (GM_Ryn_EbonyWarrior*, 816-81A) uses the same addons but is a separate set of
; armour records, which this file does not touch, so it keeps Ryn's look. His scimitar stays his.

; boots - Ebony Warrior's Boots
filterByArmors=Ryn's Snazzy Last Vigil - Ebony Warrior Overhaul.esp|000800:armorAddonsToRemove=Ryn's Snazzy Last Vigil - Ebony Warrior Overhaul.esp|000806:armorAddonsToAdd=Skyrim.esm|05B69D:modelMatch=Skyrim.esm|013960
