; Truly Nordic Ebony Armor and Weapons - Ryn's Snazzy Last Vigil (Nexus 76385, by Ryn and Gutmaw).
; This file is named after Ryn's plugin, so SkyPatcher reads it only when that plugin is active.
;
; Ryn's mod gives the Ebony Warrior (and the craftable "Vitreous Ebony" set) NEW armour records with
; their own addons and their own meshes (armor\EbonyWarrior\...), so nothing aimed at vanilla's ebony
; records reaches them. These lines name Ryn's armour records and swap each one's addon for vanilla's
; ebony addon - which is where our worn meshes are - and its ground model for vanilla's ebony one.
; Stats, enchantments, names and keywords stay Ryn's. His scimitar is left as it is: there is no
; Nordic ebony scimitar to give it.

; boots (Ebony Warrior's, Vitreous)
filterByArmors=Ryn's Snazzy Last Vigil - Ebony Warrior Overhaul.esp|000800,Ryn's Snazzy Last Vigil - Ebony Warrior Overhaul.esp|00081A:armorAddonsToRemove=Ryn's Snazzy Last Vigil - Ebony Warrior Overhaul.esp|000806:armorAddonsToAdd=Skyrim.esm|05B69D:modelMatch=Skyrim.esm|013960
